# Hugo configuration file
title: Modeling Mobility Conference
baseURL: https://ModelingMobility.org
#baseURL: https://billyc.github.io/momo
theme: hextra

# import hextra as module
#module:
#  imports:
#    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: about
      pageRef: /about
      weight: 1
    - name: momo 2025
      pageRef: /2025/
      weight: 2
    - name: '<span style="border-radius: 5px;color:white;font-weight:bold;background-color: #20BEC7;padding: 2px 6px">momo 2027<span>'
      pageRef: /2027
      weight: 3
    - name: zephyr↗
      url: 'https://zephyrtransport.org'
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search

params:
  theme:
    default: light
    displayToggle: false

  editURL:
    enable: false
    base: 'https://github.com/ZephrTransport/momo-website/edit/main/content'

  footer:
    displayCopyright: false
    displayPoweredBy: false

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: 'assets/images/JustMomo-trimmed.png'
      width: 150

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  outputs:
    home: ['HTML', 'JSON']
    speakers: ['HTML', 'JSON']
    section: ['HTML', 'JSON']
